---
# Run ONCE against a fresh VPS, as the provider's initial user (bootstrap_user, root by default).
# ../deploy.sh runs it automatically when admin_user can't log in yet.
# Creates admin_user with your SSH key and passwordless sudo. Everything else is site.yml,
# which logs in as admin_user (root login gets disabled there).
- name: Bootstrap admin user
  hosts: all
  gather_facts: false
  become: true
  vars:
    ansible_user: "{{ bootstrap_user | default('root') }}"
  tasks:
    - name: Need at least one SSH key for the admin user
      ansible.builtin.assert:
        that: admin_ssh_public_keys | length > 0
        fail_msg: "admin_ssh_public_keys is empty: run ./deploy.sh or set it in inventory/hosts.yml."

    - name: Wait for SSH / python
      ansible.builtin.wait_for_connection:
        timeout: 120

    - name: Ensure python3 is present (minimal images)
      ansible.builtin.raw: test -e /usr/bin/python3 || (apt-get update && apt-get install -y python3)
      changed_when: false

    - name: Gather facts
      ansible.builtin.setup:

    - name: Ensure sudo is installed
      ansible.builtin.apt:
        name: sudo
        state: present
        update_cache: true

    - name: Create admin user
      ansible.builtin.user:
        name: "{{ admin_user }}"
        shell: /bin/bash
        groups: sudo
        append: true
        create_home: true

    - name: Authorize SSH keys for admin user
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        key: "{{ admin_ssh_public_keys | join('\n') }}"
        exclusive: true

    - name: Passwordless sudo for admin user
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/90-{{ admin_user }}"
        content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: visudo -cf %s

    - name: Next step
      ansible.builtin.debug:
        msg: "Bootstrap done. Verify `ssh {{ admin_user }}@{{ ansible_host }}` works, then run site.yml."
