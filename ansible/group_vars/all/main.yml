---
# ---- Machine ----
# Ansible logs in as root with your existing SSH key (no separate admin user: the box only runs Hermes).
# Password SSH logins get disabled, so root must already have an authorized key.
timezone: UTC
ssh_port: 22
# fail2ban for sshd: ban an IP for fail2ban_bantime after fail2ban_maxretry failures within fail2ban_findtime.
fail2ban_maxretry: 10
fail2ban_findtime: 10m
fail2ban_bantime: 20m
# Size of /swapfile (0 disables). Added on top of any provider swap. Hermes + browser tools like >= 2 GB RAM; swap is a safety net.
swap_size_mb: 2048

# ---- Hermes ----
hermes_dir: /opt/hermes
hermes_domain: hermes.example.com
acme_email: you@example.com
# Set true while testing to avoid Let's Encrypt rate limits (cert will be untrusted).
acme_staging: false
hermes_version: stable
traefik_version: v3.6
# UID/GID of the non-root "hermes" user inside the image; the data dir must be owned by it.
hermes_container_uid: 10000
hermes_container_gid: 10000

# Hermes dashboard login: the only login (Traefik just terminates TLS and forwards).
# Also what the Hermes Desktop app signs in with (Remote gateway: https://<hermes_domain>).
hermes_dashboard_username: admin
# deploy.sh generates both and stores them in inventory/hosts.yml (gitignored).
hermes_dashboard_password: ""
hermes_dashboard_session_secret: ""

# Traefik's fixed IP on the hermes_proxy network (must match docker/compose.yml).
# Hermes trusts X-Forwarded-For only from this address.
hermes_traefik_ip: 172.30.0.254
