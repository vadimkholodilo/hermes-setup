# ../../deploy.sh generates hosts.yml (gitignored) for you. This file only shows its shape,
# in case you'd rather write it by hand.
all:
  hosts:
    hermes:
      ansible_host: '203.0.113.10'      # IP, hostname, or a Host alias from ~/.ssh/config
      ansible_user: 'root'              # or a user with passwordless sudo (e.g. 'ubuntu')
      # Optional: a key other than your defaults / ssh-agent / ~/.ssh/config.
      # ansible_ssh_private_key_file: '/Users/you/.ssh/my_vps'
      # ansible_ssh_extra_args: '-o IdentitiesOnly=yes'
      hermes_domain: 'hermes.example.com'
      acme_email: 'you@example.com'
      acme_staging: false
      hermes_timezone: 'Europe/Moscow'     # optional, defaults to timezone (UTC)
      hermes_dashboard_username: 'admin'
      hermes_dashboard_password: ''     # openssl rand -base64 18
      hermes_dashboard_session_secret: ''  # openssl rand -hex 32
