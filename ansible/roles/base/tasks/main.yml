---
- name: Upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: dist

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - htop
      - jq
      - unattended-upgrades
      - apt-listchanges
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    mode: "0644"

- name: Swap file
  when: swap_size_mb | int > 0 and ansible_facts.swaptotal_mb | int == 0
  block:
    - name: Allocate swap file
      ansible.builtin.command: "fallocate -l {{ swap_size_mb }}M /swapfile"
      args:
        creates: /swapfile

    - name: Swap file permissions
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"

    - name: Format and enable swap
      ansible.builtin.shell: mkswap /swapfile && swapon /swapfile
      changed_when: true

    - name: Persist swap in fstab
      ansible.posix.mount:
        src: /swapfile
        path: none
        fstype: swap
        opts: sw
        state: present

- name: Prefer RAM over swap
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    sysctl_file: /etc/sysctl.d/99-hermes.conf
