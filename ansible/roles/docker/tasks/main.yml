---
# Docker CE from Docker's official apt repo (distro docker.io lags and lacks the compose v2 plugin).
- name: Remove conflicting distro packages
  ansible.builtin.apt:
    name: [docker.io, docker-doc, docker-compose, docker-compose-v2, podman-docker, containerd, runc]
    state: absent

- name: Docker apt keyring dir
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Docker GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}"
    suites: "{{ ansible_facts.distribution_release }}"
    components: stable
    architectures: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"
    signed_by: /etc/apt/keyrings/docker.asc

- name: Install Docker Engine + compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Docker daemon config (log rotation)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_config | to_nice_json }}\n"
    mode: "0644"
  vars:
    docker_daemon_config:
      log-driver: json-file
      log-opts:
        max-size: 10m
        max-file: "5"
      live-restore: true
  notify: Restart docker

- name: Enable Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

# Note: docker group membership is root-equivalent. It's convenient for a single-admin box.
- name: Let admin user run docker without sudo
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: docker
    append: true

- name: Flush handlers (restart docker before deploying)
  ansible.builtin.meta: flush_handlers
