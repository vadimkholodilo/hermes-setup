---
# We're about to refuse password logins and allow only root, so root must have a key.
- name: Read root's authorized SSH keys
  ansible.builtin.slurp:
    src: /root/.ssh/authorized_keys
  register: root_authorized_keys

- name: Make sure we won't lock ourselves out
  ansible.builtin.assert:
    that:
      - ansible_user_id == 'root'
      - root_authorized_keys.content | b64decode is search('(?m)^(ssh-|ecdsa-|sk-)')
    fail_msg: >-
      site.yml must log in as root with an SSH key (root needs a key in /root/.ssh/authorized_keys),
      because it disables password SSH logins and allows only root.

- name: Install security packages
  ansible.builtin.apt:
    name: [ufw, fail2ban, python3-systemd]
    state: present

- name: SSH hardening drop-in
  # Ubuntu/Debian read sshd_config.d/*.conf first-match-wins, so 10- beats cloud-init's 50-.
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Fail2ban sshd jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    content: |
      [sshd]
      enabled = true
      port = {{ ssh_port }}
      backend = systemd
      maxretry = {{ fail2ban_maxretry }}
      findtime = {{ fail2ban_findtime }}
      bantime = {{ fail2ban_bantime }}
    mode: "0644"
  notify: Restart fail2ban

- name: UFW default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: UFW allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

# Docker-published ports bypass UFW (Docker writes its own iptables rules).
# That's fine here: only Traefik publishes ports, and only 80/443.
- name: UFW allow SSH, HTTP, HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "{{ ssh_port }}"
    - "80"
    - "443"

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Flush handlers (apply SSH changes now)
  ansible.builtin.meta: flush_handlers
