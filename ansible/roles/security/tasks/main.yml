---
# We're about to refuse password logins and allow only ansible_user, so it must have a key.
- name: Look up the SSH user's home directory
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"

- name: Read the SSH user's authorized keys
  ansible.builtin.slurp:
    src: "{{ ansible_facts.getent_passwd[ansible_user][4] }}/.ssh/authorized_keys"
  register: ssh_user_authorized_keys

- name: Make sure we won't lock ourselves out
  ansible.builtin.assert:
    that:
      - ansible_facts['user_id'] == 'root'
      - ssh_user_authorized_keys.content | b64decode is search('(?m)^(ssh-|ecdsa-|sk-)')
    fail_msg: >-
      {{ ansible_user }} must log in with an SSH key (in ~/.ssh/authorized_keys) and, if not root,
      have passwordless sudo, because this role disables password SSH logins and allows only
      {{ ansible_user }}.

- name: Install security packages
  ansible.builtin.apt:
    name: [ufw, fail2ban, python3-systemd]
    state: present

- name: SSH hardening drop-in
  # Ubuntu/Debian read sshd_config.d/*.conf first-match-wins, so 10- beats cloud-init's 50-.
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Fail2ban sshd jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    content: |
      [sshd]
      enabled = true
      port = {{ ssh_port }}
      backend = systemd
      # Passwords are off, so bots never log "Failed password". They show up as
      # "Connection closed by authenticating user ... [preauth]", which only aggressive mode counts.
      mode = aggressive
      maxretry = {{ fail2ban_maxretry }}
      findtime = {{ fail2ban_findtime }}
      bantime = {{ fail2ban_bantime }}
    mode: "0644"
  notify: Restart fail2ban

- name: UFW default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: UFW allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

# Docker-published ports bypass UFW (Docker writes its own iptables rules).
# That's fine here: only Traefik publishes ports, and only 80/443.
- name: UFW allow SSH, HTTP, HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "{{ ssh_port }}"
    - "80"
    - "443"

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Flush handlers (apply SSH changes now)
  ansible.builtin.meta: flush_handlers
