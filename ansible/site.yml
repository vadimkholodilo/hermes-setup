---
# Idempotent: configure the machine and deploy/upgrade Hermes. Safe to re-run any time.
# Normally run via ../deploy.sh. Directly:
#   ansible-playbook site.yml
#   ansible-playbook site.yml --tags hermes   # only (re)deploy the stack
- name: Configure Hermes VPS
  hosts: all
  become: true
  pre_tasks:
    - name: Supported OS check
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == 'Debian'
        fail_msg: "Only Debian/Ubuntu are supported (got {{ ansible_facts.distribution }})."
      tags: always

    - name: Refuse placeholder settings
      ansible.builtin.assert:
        that:
          - hermes_domain != 'hermes.example.com'
          - acme_email != 'you@example.com'
          - hermes_dashboard_password | length >= 12
          - hermes_dashboard_session_secret | length >= 32
        fail_msg: "Missing settings or secrets: run ./deploy.sh (it generates inventory/hosts.yml)."
      tags: always

  roles:
    - { role: base, tags: [base] }
    - { role: security, tags: [security] }
    - { role: docker, tags: [docker] }
    - { role: hermes, tags: [hermes] }
