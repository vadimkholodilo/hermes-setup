# Local dev overrides, layered on top of compose.yml (the base / production file).
# No domain, no certificates, nothing reachable from outside your machine.
#
#   make dev          # → http://hermes.localhost:8080  (login dev / dev-password)
#   make dev-down     # stop (state in ./.dev-data is kept)
#
# Without make (from the repo root):
#   docker compose -f docker/compose.yml -f docker/compose.dev.yml --env-file docker/dev.env up -d
#
# Same shape as production: Hermes publishes no ports and is only reachable through
# Traefik (plain HTTP here instead of HTTPS). Traefik's own UI: http://localhost:8081
#
# Only differences from compose.yml live here. `!override` replaces a list/map
# instead of merging into it (needs Docker Compose >= 2.24).
# Deliberately NOT named compose.override.yml: that name is auto-loaded by
# `docker compose`, so copying this dir to a server would silently apply dev settings.

name: hermes-dev

services:
  traefik:
    command: !override
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=hermes_dev_proxy
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true # Traefik's own UI on localhost:8081, dev only
      - --log.level=INFO
      - --accesslog=true
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
    ports: !override
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8081:8080"
    volumes: !override
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      proxy:
        ipv4_address: 172.31.0.254

  hermes:
    environment:
      HERMES_DASHBOARD_PUBLIC_URL: http://${HERMES_DOMAIN}:8080
    volumes: !override
      - ./.dev-data:/opt/data
    labels: !override
      - traefik.enable=true
      - traefik.http.routers.hermes.rule=Host(`${HERMES_DOMAIN}`)
      - traefik.http.routers.hermes.entrypoints=web
      - traefik.http.routers.hermes.middlewares=hermes-headers
      - traefik.http.services.hermes.loadbalancer.server.port=9119
      - traefik.http.middlewares.hermes-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.hermes-headers.headers.referrerPolicy=same-origin

networks:
  proxy:
    name: hermes_dev_proxy
    ipam: !override
      config:
        - subnet: 172.31.0.0/24
