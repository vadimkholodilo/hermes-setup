# Hermes Agent + Traefik reverse proxy.
#
# Usable standalone (copy this dir to a server, fill in .env, `docker compose up -d`)
# or deployed by the Ansible playbook in ../ansible (which places it in /opt/hermes).
#
# Layout on the server:
#   /opt/hermes/compose.yml
#   /opt/hermes/.env               <- compose variables (see .env.example)
#   /opt/hermes/data/              <- ALL Hermes state (config.yaml, .env with model keys, sessions, memories, skills)
#   /opt/hermes/letsencrypt/       <- Traefik ACME certificates

name: hermes

services:
  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.6}
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=hermes_proxy
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      # Use the staging CA while testing to avoid Let's Encrypt rate limits.
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --accesslog=true
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      proxy:
        # Fixed IP so Hermes' dashboard.trusted_proxies can name Traefik exactly.
        ipv4_address: 172.30.0.254
    security_opt:
      - no-new-privileges:true
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  hermes:
    image: nousresearch/hermes-agent:${HERMES_VERSION:-stable}
    restart: unless-stopped
    # Gateway (messaging platforms, cron, tools) + dashboard in one supervised container.
    command: gateway run
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_PUBLIC_URL: https://${HERMES_DOMAIN:?set HERMES_DOMAIN in .env}
      # Hermes' own dashboard login (required: the dashboard refuses to bind 0.0.0.0 without an auth provider).
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${DASHBOARD_USERNAME:?set DASHBOARD_USERNAME in .env}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${DASHBOARD_PASSWORD:?set DASHBOARD_PASSWORD in .env}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${DASHBOARD_SESSION_SECRET:?set DASHBOARD_SESSION_SECRET in .env}
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/opt/data
    # Headless Chromium (browser tools) needs a bigger /dev/shm than Docker's 64M default.
    shm_size: 1g
    networks:
      - proxy
    # No ports published: only reachable through Traefik.
    labels:
      - traefik.enable=true
      - traefik.http.routers.hermes.rule=Host(`${HERMES_DOMAIN}`)
      - traefik.http.routers.hermes.entrypoints=websecure
      - traefik.http.routers.hermes.tls.certresolver=letsencrypt
      - traefik.http.routers.hermes.middlewares=hermes-headers
      - traefik.http.services.hermes.loadbalancer.server.port=9119
      - traefik.http.middlewares.hermes-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.hermes-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.hermes-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.hermes-headers.headers.referrerPolicy=same-origin
    logging: *logging

networks:
  proxy:
    name: hermes_proxy
    ipam:
      config:
        - subnet: 172.30.0.0/24
